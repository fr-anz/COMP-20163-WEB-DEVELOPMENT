<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Woven-frame illustration: interlaced fiber strips frame three illustrative material studies and a quiet Habi demo tote — original procedural artwork for this fictional demo shop, not a photograph of a real bag">
  <defs>
    <pattern id="cw-weave" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#F3EADA"/>
      <path d="M16 1L31 16L16 31L1 16Z" fill="none" stroke="#C9B896" stroke-width="2.5" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Woven frame: interlaced lattice reading as a border around a quiet field -->
  <rect x="20" y="20" width="760" height="480" fill="url(#cw-weave)"/>
  <rect x="20" y="20" width="760" height="480" fill="none" stroke="#C9B896" stroke-width="1"/>
  <rect x="52" y="52" width="696" height="416" fill="#FAF6EC"/>

  <!-- Material studies: straw (lines), canvas (diamond), leather-style (plain) -->
  <g>
    <rect x="140" y="110" width="140" height="100" rx="8" fill="#E9DCC2" stroke="#C9B896" stroke-width="1.5"/>
    <path d="M152 135h116M152 160h116M152 185h116" stroke="#C9B896" stroke-width="1.5" fill="none"/>
  </g>
  <g>
    <rect x="330" y="110" width="140" height="100" rx="8" fill="#FAF6EC" stroke="#C9B896" stroke-width="1.5"/>
    <path d="M400 145L415 160L400 175L385 160Z" fill="none" stroke="#C9B896" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="520" y="110" width="140" height="100" rx="8" fill="#C9B896" stroke="#B9A77F" stroke-width="1.5"/>
  </g>

  <!-- Quiet Habi demo tote silhouette -->
  <g>
    <path d="M350 250C350 220 450 220 450 250" fill="none" stroke="#5C4A33" stroke-width="6"/>
    <path d="M320 250L335 370Q337 385 352 385L448 385Q463 385 465 370L480 250Z" fill="#8C6A4A" stroke="#5C4A33" stroke-width="4"/>
  </g>
</svg>
